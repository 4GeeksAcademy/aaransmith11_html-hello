<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://picsum.photos/200">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Instagram Photo Feed </title>
</head>
</head>
<body>
    <div class="container-fluid">
        <div class="header bg-light d-flex justify-content-between align-items-center p-3">
            <div class="header-icons">
                <i class="fa-brands fa-instagram"></i> Instagram
            </div>
            <div class="header-buttons gap-2">
                <button type="button" class="btn btn-success">Create a new post</button>
                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="fa-solid fa-gear" style="color: #ffffff;"></i>
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                      <a class="dropdown-item" href="#">Action</a>
                      <a class="dropdown-item" href="#">Another action</a>
                      <a class="dropdown-item" href="#">Something else here</a>
                    </div>
            </div>
        </div>
    </div>
    <div class="format-icons justify-content-between">
        <i class="fa-solid fa-table-cells" style= "color: #b0b0b0;"></i>
        <i class="fa-solid fa-square" style="color: #b0b0b0;"></i>
    </div>
    <div class="img justify-content-between p-2">
        <img src="https://picsum.photos/600" alt="">
        <img src="https://picsum.photos/600" alt="">
        <img src="https://picsum.photos/600" alt="">
    </div>
    <div class="img justify-content-between p-2">
        <img src="https://picsum.photos/600" alt="">
        <img src="https://picsum.photos/600" alt="">
        <img src="https://picsum.photos/600" alt="">
    </div>
    <div class="img justify-content-between p-2">
        <img src="https://picsum.photos/600" alt="">
        <img src="https://picsum.photos/600" alt="">
        <img src="https://picsum.photos/600" alt="">
    </div>
</body>
</html>
